name: bb CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v0.1.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout bb
        uses: actions/checkout@v4
        with:
          path: bb
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: run proofs and verifications
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          "${OODA_COMPILER}" build --backend c bb/qa/suite.oo -o /tmp/bb_suite
          /tmp/bb_suite

  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout bb
        uses: actions/checkout@v4
        with:
          path: bb
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: build native binary
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          mkdir -p dist
          "${OODA_COMPILER}" build --backend c bb/cli/main.oo -o dist/bb-linux-x86_64
          chmod +x dist/bb-linux-x86_64
          (cd dist && sha256sum bb-linux-x86_64 > bb-linux-x86_64.sha256)
          ls -lh dist/
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error

  bb-gate:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: checkout bb
        uses: actions/checkout@v4
        with:
          path: bb
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: install bb (download prebuilt from GitHub release)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openooda/bin"
          curl -fsSL -o "$HOME/.openooda/bin/bb" \
            "https://github.com/openOODA/bb/releases/download/v0.0.12/bb-linux-x86_64"
          curl -fsSL -o "$HOME/.openooda/bin/bb.sha256" \
            "https://github.com/openOODA/bb/releases/download/v0.0.12/bb-linux-x86_64.sha256"
          expected=$(cut -d' ' -f1 "$HOME/.openooda/bin/bb.sha256")
          actual=$(sha256sum "$HOME/.openooda/bin/bb" | cut -d' ' -f1)
          test "$expected" = "$actual" || { echo "[bb-gate FAIL] sha256 mismatch"; exit 1; }
          chmod +x "$HOME/.openooda/bin/bb"
      - name: bb double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/bb
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/*.diff[12] /tmp/flight.trace[12]' EXIT
          shopt -s nullglob
          count=0
          for f in qa/*_proof.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            ~/.openooda/bin/bb diff "$f" > "/tmp/${base}.diff1" 2>&1 || {
              echo "[bb-gate FAIL] diff non-zero exit on $f"
              exit 1
            }
            ~/.openooda/bin/bb diff "$f" > "/tmp/${base}.diff2" 2>&1 || {
              echo "[bb-gate FAIL] second diff non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.diff1" "/tmp/${base}.diff2" >/dev/null; then
              echo "[bb-gate FAIL] non-deterministic diff on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.diff1" "/tmp/${base}.diff2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[bb-gate SKIP] no qa/*_proof.oo in this repo"
            exit 0
          fi
          if [ -s .blackbox/flight.json ]; then
            ~/.openooda/bin/bb trace > /tmp/flight.trace1 2>&1 || {
              echo "[bb-gate FAIL] unreadable flight log"
              exit 1
            }
            ~/.openooda/bin/bb trace > /tmp/flight.trace2 2>&1 || {
              echo "[bb-gate FAIL] unreadable flight log on second read"
              exit 1
            }
            if ! diff -q /tmp/flight.trace1 /tmp/flight.trace2 >/dev/null; then
              echo "[bb-gate FAIL] non-deterministic flight trace"
              exit 1
            fi
            echo "[bb-gate OK] $count probes deterministic across double-run; flight log readable and deterministic"
          else
            echo "[bb-gate OK] $count probes deterministic across double-run; no flight log (no crashes recorded)"
          fi

  auto-release:
    needs: [test, build, bb-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.23
    with:
      artifact_pattern: 'release-assets-*'
      target_tag: ${{ inputs.target_tag || '' }}
